
name: TVitto Build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Extract TVitto source
        run: unzip -q TVitto.zip

      - name: Build TVitto APK
        run: |
          cd TVitto
          gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp TVitto/app/build/outputs/apk/release/app-release.apk \
             TVitto.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TVitto v${{ github.run_number }}
          files: TVitto.apk
          generate_release_notes: true
